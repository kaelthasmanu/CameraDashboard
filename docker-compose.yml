services:
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    env_file: .env
    depends_on: [backend]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [postgres]
    volumes:
      - ./mediamtx.yml:/app/mediamtx.yml:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: camera
      POSTGRES_PASSWORD: camera
      POSTGRES_DB: camera_dashboard
    volumes: [camera_db:/var/lib/postgresql/data]

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports: ["8888:8888", "8889:8889"]
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro"]

volumes:
  camera_db:
