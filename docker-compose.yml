services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    working_dir: /data
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PYTHONPATH: /app
      ALEMBIC_CONFIG: /app/alembic.ini
      MEDIAMTX_API_URL: http://mediamtx:9997
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    volumes:
      - sqlite_data:/data
      - ./mediamtx.yml:/app/mediamtx.yml:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - camera_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1.20.0
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "8889:8889"
      - "1935:1935"
      - "127.0.0.1:9997:9997"
      - "8189:8189/udp"
      - "8189:8189/tcp"
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-localhost}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

volumes:
  camera_db:
  sqlite_data: